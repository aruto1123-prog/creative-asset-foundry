[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-asset-foundry"
version = "1.0.0"
description = "Creative Asset Foundry (CAF): ローカルLLM（DeepSeek-V4.1-Flash）×ローカル画像生成（ComfyUI）統合創作研究プラットフォーム"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6,<3",
  "numpy>=1.26",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.scripts]
caf-studio = "run_studio:main"

[tool.setuptools]
py-modules = ["run_studio"]

[tool.setuptools.packages.find]
include = ["core*", "web_studio*"]

[tool.setuptools.package-data]
"core.structure_engine.seeds" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:uvicorn.*",
]
